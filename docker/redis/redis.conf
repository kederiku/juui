# Configuration de l'instance Redis de developpement (INFRA-02).
#
# CE QUE CE FICHIER FAIT, ET CE QU'IL NE PEUT PAS FAIRE
# Il porte les reglages STATIQUES du serveur. Tout ce qui vient du .env -- le
# port, un eventuel mot de passe -- reste en LIGNE DE COMMANDE dans
# docker/docker-compose.yml : un fichier de configuration Redis n'interpole
# aucune variable d'environnement, et figer 6379 ici creerait une seconde source
# de verite a cote de REDIS_PORT. Les options de la ligne de commande ont le
# dernier mot sur celles ecrites ici, dans les deux cas.
#
# POURQUOI UN FICHIER PLUTOT QUE `--appendonly yes` DANS LE COMPOSE
# Le ticket le donne pour optionnel. C'est le raisonnement INVERSE de celui qui
# a mis servers.json en ligne dans le fichier compose en INFRA-01 : un .json ne
# peut porter aucun commentaire, un redis.conf si -- et l'essentiel de ce que
# fait ce fichier tient dans ses raisons, pas dans ses six directives.
#
# COMMENT IL EST LU
# Monte en LECTURE SEULE sur /usr/local/etc/redis/redis.conf, chemin que la
# documentation officielle de l'image recommande, et passe en premier argument
# de `redis-server`. La documentation conseille un dossier accessible en
# ECRITURE, pour le cas ou l'on emploierait `CONFIG REWRITE` ; nous ne
# l'employons pas, d'ou le `:ro` assume. Une modification ici demande un
# `restart` du service : Redis ne relit pas son fichier a chaud.

# UNE INSTANCE, DEUX USAGES
# La base 0 sert de cache applicatif (BACK-14), la base 1 de broker et de
# backend de resultats pour TaskIQ (BACK-15). Voir REDIS_CACHE_DB et
# REDIS_BROKER_DB dans .env.example. Rien ici n'impose cette separation --
# elle vit dans les clients ; ce fichier ne fait que ne jamais la contredire.


# -----------------------------------------------------------------------------
# Emplacement des donnees
# -----------------------------------------------------------------------------

# Redis ecrit ses fichiers de persistance dans ce dossier. L'image le fournit
# deja comme repertoire de travail, donc la valeur par defaut `./` y menerait ;
# l'ecrire noir sur blanc evite d'avoir a le savoir, et c'est le point de
# montage du volume nomme `redis_data`.
dir /data


# -----------------------------------------------------------------------------
# Persistance
# -----------------------------------------------------------------------------

# LA raison d'etre du critere d'acceptation « les donnees survivent a un
# redemarrage ». Redis rejoue ce journal au demarrage et retrouve l'etat exact
# qu'il avait a l'arret. Depuis la 7, l'AOF n'est plus un fichier mais un
# DOSSIER multi-parties, `/data/appendonlydir/` : c'est lui qu'on doit voir
# apparaitre dans le volume.
appendonly yes

# Frequence de synchronisation sur disque. C'est deja le defaut de Redis ; il
# est ecrit ici parce que c'est le seul arbitrage interessant de ce fichier :
#   always   -- aucune perte, mais un fsync par ecriture, tres lent ;
#   everysec -- au pire une seconde d'ecritures perdues sur arret BRUTAL, et
#               zero sur un arret propre (`docker compose down` ou `restart`,
#               qui envoient SIGTERM et laissent Redis vider son tampon) ;
#   no       -- a la main du systeme, plusieurs dizaines de secondes exposees.
appendfsync everysec

# `save` n'est PAS redefini : les points de sauvegarde RDB integres a Redis
# restent actifs et coexistent avec l'AOF. Deux mecanismes plutot qu'un, sans
# rien couter ici -- l'AOF sert la reprise, l'instantane RDB sert la copie.
# Ne pas ecrire `save ""`, qui les desactiverait.


# -----------------------------------------------------------------------------
# Memoire -- volontairement SANS plafond
# -----------------------------------------------------------------------------
# `maxmemory` reste a 0 (illimite), et c'est un choix, pas un oubli.
#
# LE PIEGE, s'il fallait un jour poser un plafond : la politique d'eviction
# s'applique a TOUTE l'instance, sans distinguer les bases. Une politique
# `allkeys-lru` ou `allkeys-random` prendrait donc ses victimes aussi bien dans
# le cache (base 0) que dans la file de taches (base 1) -- et supprimerait des
# taches en attente, en silence, sans la moindre erreur cote appelant.
#
# La seule politique acceptable pour cette instance partagee est donc :
#
#   maxmemory 256mb
#   maxmemory-policy volatile-lru
#
# `volatile-*` ne touche QUE les cles porteuses d'un TTL. BACK-14 en pose un sur
# chaque entree de cache ; les cles de TaskIQ n'en ont pas et deviennent, de
# fait, ineligibles a l'eviction. Corollaire a connaitre : une fois le plafond
# atteint sans cle volatile a liberer, les ECRITURES echouent en OOM plutot que
# de rogner sur la file -- c'est exactement l'effet recherche.


# -----------------------------------------------------------------------------
# Reseau -- rien a declarer, et c'est important
# -----------------------------------------------------------------------------
# Ni `bind` ni `protected-mode` ne figurent ici, deliberement. L'image
# officielle desactive le mode protege « pour faciliter l'acces a Redis depuis
# d'autres conteneurs via le reseau Docker » ; ecrire l'un ou l'autre risquerait
# de revenir sur ce reglage et de rendre le serveur injoignable depuis
# app_network, avec un `DENIED Redis is running in protected mode` pour seule
# explication.
#
# Ce qui protege cette instance n'est donc pas une directive de ce fichier, mais
# la facon dont son port est PUBLIE : le fichier compose le rattache a
# 127.0.0.1, jamais a toutes les interfaces du poste. Voir le commentaire du
# service `redis` et le registre des ecarts du site de documentation.
#
# `requirepass` est absent pour la meme raison : l'instance de developpement n'a
# pas de mot de passe. REDIS_PASSWORD, dans .env.example, est une variable
# CLIENTE (BACK-14, BACK-15) ; la decommenter ne suffirait pas a en creer un
# cote serveur.


# -----------------------------------------------------------------------------
# Journalisation
# -----------------------------------------------------------------------------

# Vers la sortie standard -- c'est le defaut de l'image, et la condition pour
# que `docker compose logs redis` montre quoi que ce soit. Un chemin de fichier
# ici enverrait les journaux dans le conteneur, ou personne ne va les chercher.
logfile ""

# `notice` est le defaut : demarrage, sauvegardes, avertissements. `verbose`
# ajoute de quoi suivre les connexions, utile le jour ou un client n'arrive pas
# a se rattacher.
loglevel notice
