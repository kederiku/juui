# Pile de developpement conteneurisee (INFRA-01 pour le socle ; ensuite un
# service par ticket, chacun nomme dans le commentaire qui l'introduit).
#
# Ce fichier assemble les services d'infrastructure du poste. INFRA-01 en pose
# les deux premiers -- PostgreSQL et pgAdmin -- et surtout le socle dont
# heriteront les suivants : le reseau `app_network`, la convention de
# healthcheck, et l'interpolation systematique depuis le .env.
#
# OU VIT LE .env
# Ce fichier est dans docker/, le .env est a la RACINE. Livre a lui-meme,
# `docker compose` chercherait son .env a cote de lui, ne trouverait rien, et
# toutes les `${...}` ci-dessous vaudraient la chaine vide -- sans la moindre
# erreur. D'ou le `--project-directory .` de toutes les commandes du README, et
# plus tard de `make up` (INFRA-06) :
#
#   docker compose --project-directory . -f docker/docker-compose.yml up -d
#
# CONSEQUENCE, contre-intuitive et verifiee : `--project-directory` ne deplace
# pas seulement la recherche du .env, il deplace AUSSI la resolution des chemins
# relatifs des montages. Ceux-ci partent donc de la RACINE, pas de docker/ --
# d'ou le `./docker/postgres/init` plus bas, qui a l'air d'une faute de frappe
# et n'en est pas une. Ce fichier n'est utilisable QUE lance ainsi ; toute autre
# invocation monterait un dossier inexistant, que Docker creerait vide, sans
# erreur et sans base de test.
#
# `docker compose config` imprime les chemins absolus finalement retenus : c'est
# la verification a faire apres toute modification de ce fichier.
#
# Pas de cle `version:` : obsolete depuis Compose V2, qui avertit si elle est la.
#
# Chaque variable employee ici est documentee dans .env.example, ticket par
# ticket. Ce fichier ne redit pas ce qu'elle vaut, seulement ce qu'il en fait.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL -- base applicative (INFRA-01, consommee par BACK-05 et BACK-12)
  # ---------------------------------------------------------------------------
  postgres:
    # Le ticket demande une 16 ; on lit une 18. Voir « Ecarts assumes avec le
    # ticket INFRA-01 » dans le README.
    image: postgres:18-alpine

    environment:
      # Noms IMPOSES par l'image officielle : les renommer casserait
      # l'initialisation du cluster.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Pas lu par l'image, mais par notre script d'initialisation : c'est ce qui
      # permet a .env.example de promettre que le nom de la base de test reste
      # modifiable sans toucher au script.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}

      # C'est cette ligne, et elle seule, qui rend POSTGRES_PORT effectif. Le
      # postmaster prend PGPORT comme port par defaut ; le serveur temporaire de
      # la phase d'initialisation le suit, et `pg_isready` aussi puisque c'est
      # aussi une variable libpq. Sans elle, POSTGRES_PORT ne serait qu'une
      # decoration a droite du mapping ci-dessous : le serveur ecouterait 5432
      # quoi qu'il arrive, et le publier sur un autre port echouerait.
      PGPORT: ${POSTGRES_PORT}

    ports:
      # <port publie sur le poste>:<port ecoute dans app_network>. Seul le
      # premier a besoin de changer quand un PostgreSQL local occupe deja 5432.
      - '${POSTGRES_HOST_PORT}:${POSTGRES_PORT}'

    volumes:
      # PIEGE MAJEUR, et la raison d'etre du critere d'acceptation « les donnees
      # survivent a un down puis up ». Depuis la 18, l'image a DEPLACE ses
      # donnees : PGDATA vaut /var/lib/postgresql/18/docker et le VOLUME declare
      # est /var/lib/postgresql. Le montage traditionnel sur
      # /var/lib/postgresql/data ne produit AUCUNE erreur -- il ne recoit
      # simplement plus rien, les donnees partent dans un volume anonyme, et
      # elles disparaissent au premier `down`. Monter le dossier parent, donc.
      - postgres_data:/var/lib/postgresql

      # Scripts joues UNE SEULE FOIS, a la creation du cluster. Chemin relatif
      # a la RACINE et non a docker/ -- voir la mise en garde en tete de fichier.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # `$$` echappe le `$` : sans cela compose interpolerait ces deux variables
      # depuis le .env de l'hote au lieu de les laisser au shell du conteneur.
      #
      # `-h 127.0.0.1` n'est pas decoratif. Pendant l'initialisation, l'entrypoint
      # demarre un serveur temporaire avec `listen_addresses=''` : joignable par
      # la socket Unix, mais par aucune connexion TCP. Un `pg_isready` sans hote
      # passerait par cette socket et declarerait le service sain alors qu'il
      # n'accepte encore personne -- et les `service_healthy` des services
      # dependants (INFRA-04) partiraient trop tot.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      # `start_period` couvre la premiere initialisation, la plus lente : les
      # echecs qui y surviennent ne comptent pas dans `retries`.
      start_period: 30s
      retries: 5

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin -- console d'administration de la base (INFRA-01)
  # ---------------------------------------------------------------------------
  pgadmin:
    # Tag de MAJEURE : les correctifs arrivent au prochain `docker pull`, jamais
    # un changement d'interface en pleine semaine.
    image: dpage/pgadmin4:9

    environment:
      # Noms imposes par l'image. L'adresse doit etre syntaxiquement valide,
      # sinon le conteneur refuse de demarrer.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

      # En mode serveur, pgAdmin reclame par defaut un « mot de passe maitre »
      # a la premiere connexion, avant meme d'afficher quoi que ce soit. Ce
      # serait exactement la saisie manuelle que le ticket demande d'eviter.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

      # Sans cela l'image demarre un Postfix pour envoyer des courriels de
      # reinitialisation de mot de passe. Sur un poste de developpement il
      # n'enverra jamais rien, et il rallonge chaque demarrage.
      PGADMIN_DISABLE_POSTFIX: 'True'

      # Par defaut, la definition de serveur ci-dessous n'est lue qu'a la
      # CREATION de la base de configuration de pgAdmin -- donc une seule fois
      # dans la vie du volume `pgadmin_data`. Avec ce drapeau elle est rejouee a
      # chaque demarrage : changer POSTGRES_USER dans le .env suffit alors a
      # mettre la console a jour, sans `down -v`.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'

      # Fichier de mots de passe au format libpq, fabrique plus bas. C'est lui
      # qui evite d'avoir a retaper POSTGRES_PASSWORD a chaque ouverture de la
      # connexion.
      PGPASS_FILE: /pgpass

    configs:
      # `/pgadmin4/servers.json` est le chemin que l'image lit d'office.
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      # PGPASS_FILE fait recopier ce fichier par l'entrypoint dans l'espace de
      # stockage de l'utilisateur, sous le nom `.pgpass` et en 0600 -- ce que
      # libpq exige. `uid: '5050'` est necessaire : le montage est en lecture
      # seule et 0400, donc illisible par le compte pgadmin s'il ne lui
      # appartient pas. Le gid n'est pas force, le compte pgadmin de l'image
      # etant du groupe root.
      - source: pgadmin_pgpass
        target: /pgpass
        uid: '5050'
        mode: 0400

    ports:
      # Le conteneur ecoute sur 80 ; PGADMIN_HOST_PORT vaut 5050 par defaut.
      - '${PGADMIN_HOST_PORT}:80'

    volumes:
      # Base de configuration de pgAdmin, sessions et fichiers utilisateur.
      # L'image tourne en uid 5050 ; un volume nomme encore vide herite des
      # droits du dossier de l'image, il n'y a donc rien a ajuster a la main.
      - pgadmin_data:/var/lib/pgadmin

    healthcheck:
      # /misc/ping repond `PING` en 200 sans authentification : c'est la sonde
      # que pgAdmin expose pour cet usage. `wget` est present dans l'image.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/misc/ping']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    depends_on:
      # pgAdmin demarrerait tres bien sans base. La dependance est ici pour poser
      # le motif que reprendront INFRA-04 et BACK-15, pour qui attendre un
      # PostgreSQL REELLEMENT pret sera vital.
      postgres:
        condition: service_healthy

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis -- cache applicatif ET broker de taches (INFRA-02, consomme par
  # BACK-14 et BACK-15)
  # ---------------------------------------------------------------------------
  # Une seule instance, deux usages separes par le NUMERO DE BASE : la 0 pour le
  # cache, la 1 pour la file de taches. Rien ici ne l'impose -- la convention
  # vit dans REDIS_CACHE_DB et REDIS_BROKER_DB, et dans les clients qui les
  # lisent. Ce service se contente de ne jamais la contredire, et la console
  # plus bas la rend visible.
  redis:
    # Le ticket demande une 7 ; on lit une 8. Voir « Ecarts assumes avec le
    # ticket INFRA-02 » dans le README.
    image: redis:8-alpine

    # Deux arguments, deux natures. Le fichier porte les reglages statiques et
    # les raisons qui les accompagnent ; le port vient du .env, et il ne peut
    # venir que d'ici -- un redis.conf n'interpole aucune variable
    # d'environnement. En cas de desaccord, la ligne de commande l'emporte.
    #
    # Chemin relatif a la RACINE et non a docker/ : meme mise en garde qu'en
    # tete de fichier.
    command: redis-server /usr/local/etc/redis/redis.conf --port ${REDIS_PORT}

    ports:
      # Rattache a la BOUCLE LOCALE, contrairement a `postgres` ci-dessus.
      # L'asymetrie est voulue : postgres exige un mot de passe, cette instance
      # Redis n'en a pas. Sans le `127.0.0.1:`, Docker publierait sur toutes les
      # interfaces du poste, et n'importe qui sur le meme reseau -- un wifi
      # partage suffit -- pourrait y lire et y ecrire sans rien presenter. Les
      # conteneurs, eux, passent par app_network et ne sont pas concernes.
      - '127.0.0.1:${REDIS_HOST_PORT}:${REDIS_PORT}'

    volumes:
      # /data est a la fois le VOLUME declare par l'image et son repertoire de
      # travail ; c'est la que redis.conf pointe `dir`, donc la que Redis cree
      # `appendonlydir/`. Rien a deplacer, contrairement au piege de postgres 18.
      - redis_data:/data

      # Lecture seule : voir « COMMENT IL EST LU » en tete du redis.conf.
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      # `| grep -q PONG` n'est pas une coquetterie. Au demarrage, le temps de
      # rejouer l'AOF, le serveur repond `LOADING Redis is loading the dataset
      # in memory` : il ecoute deja, mais ne sert encore rien. C'est le grep, et
      # non le code de retour de redis-cli, qui distingue les deux -- et qui
      # rendra fiables les `service_healthy` de BACK-15 et INFRA-04.
      test: ['CMD-SHELL', 'redis-cli -p ${REDIS_PORT} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      # Bien plus court que celui de postgres : Redis n'a aucune initialisation
      # de cluster a mener, il relit un journal deja ecrit.
      start_period: 10s
      retries: 5

    # Pas de depends_on : Redis ne depend de rien. C'est l'inverse qui viendra,
    # le worker de BACK-15 et l'API d'INFRA-04 attendant le healthcheck ci-dessus.
    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RedisInsight -- console d'inspection de Redis (INFRA-02, profil `tools`)
  # ---------------------------------------------------------------------------
  redisinsight:
    # Pas de tag de majeure nue chez cette image -- `3` n'existe pas : on
    # epingle la ligne mineure courante, plus proche equivalent du
    # `dpage/pgadmin4:9` d'INFRA-01.
    image: redis/redisinsight:3.8

    # Le ticket demande que cette console ne demarre PAS d'office. Un service
    # rattache a un profil est ignore par `docker compose up` tant que
    # `--profile tools` n'est pas passe ; son port n'est donc occupe que sur
    # demande.
    profiles: [tools]

    environment:
      # Connexions pre-remplies : l'equivalent RedisInsight du servers.json de
      # pgAdmin. Le suffixe numerique distingue les entrees, et il commence a 1.
      #
      # Elles sont DEUX a dessein. C'est le seul endroit du depot ou la
      # convention « base 0 = cache, base 1 = broker » cesse d'etre un
      # commentaire pour devenir quelque chose qu'on voit en ouvrant la console.
      #
      # A SAVOIR : ces variables font autorite a chaque demarrage. Une connexion
      # ajoutee a la main dans l'interface disparaitra au redemarrage suivant.
      RI_REDIS_HOST1: redis
      RI_REDIS_PORT1: ${REDIS_PORT}
      RI_REDIS_DB1: ${REDIS_CACHE_DB}
      RI_REDIS_ALIAS1: 'Juui - cache applicatif (base ${REDIS_CACHE_DB})'

      RI_REDIS_HOST2: redis
      RI_REDIS_PORT2: ${REDIS_PORT}
      RI_REDIS_DB2: ${REDIS_BROKER_DB}
      RI_REDIS_ALIAS2: 'Juui - broker TaskIQ (base ${REDIS_BROKER_DB})'

      # Sans cela, la console s'ouvre sur des conditions d'utilisation a
      # accepter -- exactement la saisie manuelle qu'INFRA-01 s'etait attache a
      # eviter cote pgAdmin. C'est deja le defaut de l'image ; l'ecrire met le
      # comportement a l'abri d'un changement de defaut.
      RI_ACCEPT_TERMS_AND_CONDITIONS: 'true'

    ports:
      # 5540 en dur a droite : l'image ecrit elle-meme que le port est fige, et
      # RI_APP_PORT ne ferait que deplacer la question. Boucle locale a gauche,
      # comme redis, et pour une raison de plus : cette console n'a AUCUNE
      # authentification et donne acces a toutes les donnees de l'instance.
      - '127.0.0.1:${REDISINSIGHT_HOST_PORT}:5540'

    volumes:
      # Base locale de la console : connexions, historique du Workbench, index.
      # L'image tourne en uid 1000 et cree /data a ce compte ; un volume nomme
      # encore vide en herite les droits, il n'y a rien a ajuster a la main.
      - redisinsight_data:/data

    healthcheck:
      # Sonde que la console expose pour cet usage, sur le meme modele que celle
      # de pgAdmin -- a UN detail pres, verifie a la main : `127.0.0.1` et non
      # `localhost`. Le /etc/hosts du conteneur fait pointer `localhost` sur
      # 127.0.0.1 ET sur ::1, wget tente l'IPv6 d'abord, et RedisInsight
      # n'ecoute qu'en IPv4 (RI_APP_HOST vaut 0.0.0.0). Avec `localhost` la
      # sonde echoue donc en boucle sur un `Connection refused`, alors meme que
      # la console repond parfaitement depuis le navigateur.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:5540/api/health/']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    depends_on:
      # Ici la dependance n'est pas decorative, comme elle l'etait pour pgAdmin :
      # sans Redis joignable, la console ouvre sur deux connexions en erreur.
      redis:
        condition: service_healthy

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO -- stockage objet compatible S3 (INFRA-03, consomme par BACK-13)
  # ---------------------------------------------------------------------------
  # Tient lieu d'Amazon S3 sur le poste. UN SEUL parametre distinguera les deux
  # cote application : S3_ENDPOINT_URL, laisse vide en production. Rien dans le
  # code de BACK-13 ne saura donc s'il parle a ce conteneur ou a AWS.
  minio:
    # Derniere image publiee, sur Docker Hub comme sur quay.io : MinIO n'y
    # publie plus rien depuis septembre 2025. Le correctif de CVE-2025-62506
    # (octobre 2025) n'existe donc qu'en binaire -- voir « Ecarts assumes avec
    # le ticket INFRA-03 » dans le README, qui dit pourquoi il ne concerne pas
    # cette instance.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    # `server /data` : un seul disque, ce qui suffit a un poste. Sans
    # `--console-address`, la console web choisirait un port AU HASARD a chaque
    # demarrage, et le mapping ci-dessous ne pointerait sur rien.
    command: server /data --console-address ":9001"

    environment:
      # Noms imposes par l'image. Contrairement a ceux de PostgreSQL, ils sont
      # relus a CHAQUE demarrage : les changer dans le .env puis redemarrer
      # suffit, sans `down -v`.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Region du site. Tant que rien n'est declare ici, MinIO accepte celle que
      # le client annonce, quelle qu'elle soit ; l'ecrire fait de S3_REGION une
      # description exacte du serveur plutot qu'une valeur que seul le client
      # connaitrait.
      MINIO_SITE_REGION: ${S3_REGION}

    ports:
      # API S3 : c'est ce port que vise S3_ENDPOINT_URL depuis un client lance
      # HORS Docker. 9000 et 9001 sont figes a droite, comme le 5540 de
      # redisinsight -- `--console-address` ci-dessus fixe le second, et le
      # premier est celui qu'ecrit deja S3_ENDPOINT_URL.
      - '${MINIO_API_HOST_PORT}:9000'

      # Console web. Publiee sur toutes les interfaces, contrairement a redis et
      # a redisinsight : MinIO, lui, reclame des identifiants.
      - '${MINIO_CONSOLE_HOST_PORT}:9001'

    volumes:
      # `/data` est l'argument de `server` ci-dessus, et le VOLUME que declare
      # l'image. Rien a deplacer, contrairement au piege de postgres 18.
      - minio_data:/data

    healthcheck:
      # La sonde de vivacite que demande le ticket, non authentifiee. `curl` est
      # bien present dans cette image : il en avait disparu fin 2023, d'ou le
      # `mc ready local` qu'on lit encore dans les exemples de MinIO. Verifie
      # avant d'ecrire cette ligne, et a reverifier avant tout changement de tag.
      #
      # `127.0.0.1` et non `localhost`, meme raison qu'en INFRA-02 : le resolveur
      # du conteneur tente l'IPv6 en premier.
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      # Court : MinIO ne formate son disque qu'au tout premier demarrage, et
      # cela prend moins d'une seconde.
      start_period: 15s
      retries: 5

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # minio-init -- amorcage du bucket applicatif (INFRA-03)
  # ---------------------------------------------------------------------------
  # Conteneur EPHEMERE : il attend un MinIO sain, cree le bucket s'il manque,
  # confirme qu'il reste prive, puis se termine. `docker compose ps` le montre
  # ensuite en `Exited (0)` -- c'est le resultat attendu, pas une panne.
  minio-init:
    # Le client en ligne de commande de MinIO, dans sa derniere version publiee
    # -- celle-la meme qu'embarque l'image serveur ci-dessus.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z

    environment:
      # Le script ne lit que ces quatre variables.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}

    # L'entrypoint de l'image est `mc` lui-meme : sans cette ligne, le chemin du
    # script serait pris pour une sous-commande de mc.
    entrypoint: ['/bin/sh', '/scripts/init-bucket.sh']

    volumes:
      # Chemin relatif a la RACINE et non a docker/ -- voir la mise en garde en
      # tete de fichier. Lecture seule : ce script n'a rien a reecrire.
      - ./docker/minio/init-bucket.sh:/scripts/init-bucket.sh:ro

    depends_on:
      # Dependance VITALE, la ou celle de pgadmin etait decorative : sans un
      # MinIO qui repond deja, `mc` echouerait des la premiere commande.
      minio:
        condition: service_healthy

    # Deja le defaut de compose, ecrit malgre tout : les quatre services
    # au-dessus portent tous `unless-stopped`, et le recopier ici relancerait
    # sans fin un conteneur dont le travail EST de se terminer. Entre quotes,
    # sans quoi YAML lirait `no` comme le booleen `false`.
    restart: 'no'

    networks: [app_network]

  # ---------------------------------------------------------------------------
  # api -- service d'API FastAPI (INFRA-04, consomme par INFRA-05b et QA-03)
  # ---------------------------------------------------------------------------
  # Premier service APPLICATIF de la pile : les cinq precedents sont des briques
  # d'infrastructure tirees d'images publiques, celui-ci se construit depuis le
  # depot.
  #
  # OU EST DECLAREE CETTE IMAGE
  # docker/api/Dockerfile, dont l'en-tete explique pourquoi il ne vit pas dans
  # backend/api/ et pourquoi son entrypoint arrive par un contexte additionnel.
  api:
    build:
      # LE CONTEXTE EST backend/api, ET NON LA RACINE. C'est ce qui rend
      # backend/api/.dockerignore effectif -- Docker ne lit qu'un seul fichier
      # d'exclusion, celui de la racine du contexte -- et ce qui evite d'envoyer
      # node_modules au demon.
      #
      # Chemin relatif a la RACINE et non a docker/ : meme mise en garde qu'en
      # tete de fichier. `docker compose config` imprime le chemin absolu
      # finalement retenu, c'est la verification a faire apres toute
      # modification de ce bloc.
      context: ./backend/api

      # Resolu, lui, relativement au CONTEXTE ci-dessus et non au repertoire de
      # projet : d'ou les deux `..` qui ramenent a la racine. Un Dockerfile hors
      # contexte est parfaitement admis par BuildKit.
      dockerfile: ../../docker/api/Dockerfile

      # Image servie, sans rechargement a chaud. INFRA-05b basculera sur `dev`
      # depuis docker-compose.override.yml.
      target: prod

      # CONTEXTE ADDITIONNEL. entrypoint.sh vit dans docker/api/, donc hors du
      # contexte de build : sans cette ligne, le `COPY --from=scripts` du
      # Dockerfile n'aurait rien a copier. Un build lance a la main doit passer
      # l'equivalent, `--build-context scripts=docker/api`.
      additional_contexts:
        scripts: ./docker/api

    environment:
      # L'API lit sa configuration par ces variables et par elles seules
      # (BACK-03) : le .env de backend/api n'est ni copie dans l'image ni monte
      # ici, et le .dockerignore l'exclut explicitement.
      #
      # POURQUOI UNE LISTE EXPLICITE PLUTOT QU'UN `env_file`
      # BACK-03 filtre les variables du PROCESSUS sur les champs declares : le
      # conteneur supporterait donc sans broncher le .env complet de la racine.
      # La liste est malgre tout ecrite a la main, pour trois raisons -- c'est le
      # style des cinq services ci-dessus ; l'interpolation `${...}` suit
      # `--project-directory` sans ambiguite, la ou un chemin `env_file`
      # demanderait une verification de plus ; et PGADMIN_DEFAULT_PASSWORD n'a
      # rien a faire dans l'environnement de l'API.

      # --- Application (BACK-03, BACK-11) ---
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # --- PostgreSQL (BACK-05) ---
      # POSTGRES_HOST vaut `postgres` et POSTGRES_PORT le port INTERNE : depuis
      # app_network, on ne passe jamais par les ports publies sur le poste.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      # Reglages du pool de connexions, avec un defaut EN DUR ici. C'est ce qui
      # les rend facultatives dans le .env : sans le `:-`, un .env anterieur a
      # BACK-05 -- il en existe -- transmettrait une chaine vide, et l'API
      # refuserait de demarrer sur une valeur entiere invalide. Meme precaution
      # que WEB_CONCURRENCY plus bas.
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}
      POSTGRES_POOL_RECYCLE_SECONDS: ${POSTGRES_POOL_RECYCLE_SECONDS:-1800}
      POSTGRES_ECHO: ${POSTGRES_ECHO:-false}

      # --- Redis (BACK-14, BACK-15) ---
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB}
      REDIS_BROKER_DB: ${REDIS_BROKER_DB}

      # --- Stockage objet (BACK-13) ---
      # MINIO_ROOT_USER et MINIO_ROOT_PASSWORD sont passes en tant qu'ALIAS DE
      # REPLI de S3_ACCESS_KEY et S3_SECRET_KEY : BACK-03 les declare en
      # AliasChoices, ce qui evite d'ecrire deux fois la meme valeur dans le
      # .env. Les activer explicitement cote .env les ferait passer devant.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # --- Jetons (BACK-10) ---
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}

      # --- Courriel sortant : A DECOMMENTER EN BACK-22 ---
      # Le service `mailpit` existe depuis INFRA-07, ses six variables sont
      # documentees dans .env.example, mais AUCUNE LIGNE DE CODE ne les lit
      # encore : l'adaptateur SMTP est l'objet de BACK-22.
      #
      #   SMTP_HOST: ${SMTP_HOST}
      #   SMTP_PORT: ${SMTP_PORT}
      #   SMTP_USER: ${SMTP_USER}
      #   SMTP_PASSWORD: ${SMTP_PASSWORD}
      #   SMTP_USE_TLS: ${SMTP_USE_TLS}
      #   MAIL_FROM: ${MAIL_FROM}
      #
      # POURQUOI PAS DES MAINTENANT, alors que Redis, S3 et JWT sont bien passes
      # avant leurs tickets : ceux-la ont ete ajoutes par INFRA-04, qui les
      # trouvait DEJA dans le .env.example de SETUP-05. Les six ci-dessus
      # naissent avec INFRA-07, donc apres les .env deja crees sur les postes --
      # les referencer produirait six avertissements `variable is not set` a
      # chaque `up`, pour des variables que personne ne lit. Meme attente que le
      # `depends_on: minio-init` laisse a BACK-13 plus bas.

      # --- Serveur uvicorn (INFRA-04) ---
      # Les deux SEULES variables du fichier a porter une valeur de repli, et
      # c'est deliberé : elles naissent avec ce ticket, donc tout .env cree
      # avant lui les ignore. Sans repli, `WEB_CONCURRENCY` vide donnerait un
      # `int('')` et un conteneur en boucle de redemarrage, et
      # `FORWARDED_ALLOW_IPS` vide ne ferait plus confiance a personne -- en
      # silence. Les valeurs ci-dessous sont celles de .env.example.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    ports:
      # Le conteneur ecoute sur 8000 quoi qu'il arrive -- c'est ecrit dans le
      # CMD de l'image, pas dans une variable. Seul le port publie se regle.
      - '${API_HOST_PORT}:8000'

    depends_on:
      # Dependances VITALES, et non decoratives comme celle de pgadmin :
      # l'entrypoint attend PostgreSQL avant de lancer quoi que ce soit, et le
      # `service_healthy` evite qu'il commence a compter ses trente tentatives
      # pendant l'initialisation du cluster.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # A AJOUTER EN BACK-13, quand l'API touchera reellement au bucket :
      #   minio-init:
      #     condition: service_completed_successfully
      # L'ajouter des maintenant retarderait le demarrage sans rien garantir de
      # plus -- aucun code ne parle encore a MinIO.

    healthcheck:
      # SONDE PROVISOIRE. Le ticket vise `/health/live`, qui releve de BACK-08 et
      # n'existe pas encore : la poser aujourd'hui laisserait le service
      # indefiniment `unhealthy`, et bloquerait les `depends_on` d'INFRA-05b.
      # `/openapi.json` repond 200 des a present et disparaitra rarement. A
      # BASCULER SUR /health/live A BACK-08.
      #
      # En python plutot qu'en curl ou wget : l'image `python:3.14-slim` n'en
      # embarque aucun des deux, et en ajouter un contredirait le « runtime
      # minimal » du ticket. urlopen leve sur tout code hors 2xx, l'appel se
      # suffit donc a lui-meme.
      #
      # `127.0.0.1` et non `localhost`, comme pour redisinsight et minio : le
      # resolveur du conteneur tente l'IPv6 en premier, or uvicorn n'ecoute
      # qu'en IPv4 (--host 0.0.0.0).
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      # Couvre l'attente de PostgreSQL et les migrations de l'entrypoint, qui
      # precedent le premier octet servi.
      start_period: 30s
      retries: 5

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit -- serveur SMTP de developpement et boite de reception (INFRA-07,
  # consomme par BACK-17, BACK-22, FRONT-14 et FRONT-15)
  # ---------------------------------------------------------------------------
  # Tient lieu de fournisseur d'envoi sur le poste, comme minio tient lieu
  # d'Amazon S3 depuis INFRA-03 : il ACCEPTE tout et n'EXPEDIE rien. Sans lui, le
  # parcours d'inscription s'arrete definitivement a l'ecran de saisie du code
  # OTP -- l'e-mail part, personne ne le lit, et le compte reste non verifie.
  #
  # DEUX FACADES, ET LA SECONDE COMPTE AUTANT QUE LA PREMIERE
  # Le port SMTP recoit, la boite web affiche -- mais c'est l'API HTTP de cette
  # meme boite qui rendra les tests possibles : /api/v1/messages livre le code
  # REELLEMENT emis. C'est la seule facon prevue de le recuperer en BACK-17 et en
  # QA-04. Lire Redis a la place testerait ce que le code a ecrit, jamais ce que
  # l'utilisateur a recu.
  #
  # LE CODE DE L'ADAPTATEUR N'EST PAS ICI
  # Ce service, ses variables et sa sonde relevent d'INFRA-07 ; l'adaptateur SMTP
  # qui les consommera appartient a BACK-22. Meme partage qu'entre INFRA-05b et
  # BACK-15 pour le worker.
  mailpit:
    # Ligne MINEURE et non majeure nue : cette image ne publie pas de tag `v1`.
    # Meme arbitrage que le `redis/redisinsight:3.8` d'INFRA-02, pour la meme
    # raison -- on epingle le plus large des tags qui existe reellement.
    image: axllent/mailpit:v1.31

    environment:
      # CE QUI REND LES DEUX PORTS EFFECTIFS. Mailpit ecoute 1025 et 8025 par
      # defaut ; sans ces deux lignes, SMTP_PORT et MAILPIT_WEB_PORT ne seraient
      # qu'une decoration a droite des mappings ci-dessous, et les changer
      # publierait un port sur un service qui ecoute ailleurs. Meme raisonnement
      # que le PGPORT d'INFRA-01.
      #
      # `0.0.0.0` est l'adresse DANS le conteneur, pas sur le poste : c'est le
      # `127.0.0.1:` a gauche des mappings qui restreint la publication, et lui
      # seul. Mettre `127.0.0.1` ici rendrait au contraire le service injoignable
      # depuis app_network, donc depuis l'API.
      MP_SMTP_BIND_ADDR: 0.0.0.0:${SMTP_PORT}
      MP_UI_BIND_ADDR: 0.0.0.0:${MAILPIT_WEB_PORT}

      # MP_MAX_MESSAGES est volontairement absente : son defaut de 500 suffit
      # largement a un poste, et la boite repart vide a chaque redemarrage de
      # toute facon -- voir juste en dessous.

    ports:
      # Rattaches a la BOUCLE LOCALE, comme redis et redisinsight, et pour une
      # raison de plus. Ces deux-la n'ont pas d'authentification ; celui-ci non
      # plus, ET il accepte n'importe quel message de n'importe qui. Sans le
      # `127.0.0.1:`, le poste offrirait a tout le reseau -- un wifi partage
      # suffit -- un relais SMTP ouvert en ecriture et la lecture de tous les
      # courriels deja captures, codes OTP compris. Les conteneurs, eux, passent
      # par app_network et ne sont pas concernes.
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT}:${SMTP_PORT}'
      - '127.0.0.1:${MAILPIT_WEB_HOST_PORT}:${MAILPIT_WEB_PORT}'

    # AUCUN VOLUME, ET C'EST UN CRITERE D'ACCEPTATION. Les mails de
    # developpement n'ont pas a survivre a un redemarrage : une boite qui repart
    # vide est une boite ou le dernier message est forcement celui qu'on vient
    # de declencher.
    #
    # A SAVOIR SI L'ENVIE VENAIT DE LES GARDER : ajouter un volume ne suffirait
    # pas. Sans MP_DATABASE, Mailpit garde tout EN MEMOIRE et n'ecrit nulle part
    # -- le volume serait monte, resterait vide, et ne produirait aucune erreur.

    healthcheck:
      # La sonde que l'image declare elle-meme dans son HEALTHCHECK, reecrite ici
      # pour deux raisons : les sept services au-dessus declarent tous la leur,
      # et les intervalles suivent ainsi ceux du depot plutot que ceux de
      # l'image.
      #
      # `readyz` est une SOUS-COMMANDE du binaire, pas un endpoint tape a la
      # main : elle appelle /readyz sur l'interface web -- l'endpoint que demande
      # le ticket -- en relisant MP_UI_BIND_ADDR. Elle suit donc un changement de
      # MAILPIT_WEB_PORT toute seule, la ou un `wget http://127.0.0.1:8025/...`
      # figerait le port une seconde fois.
      #
      # Elle evite au passage le piege qui a deja coute trois commentaires a ce
      # fichier (redisinsight, minio, api) : pas de `localhost` a resoudre, donc
      # pas de tentative IPv6 sur un service qui n'ecoute qu'en IPv4.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      # Court : Mailpit n'a ni cluster a initialiser ni journal a relire, il
      # ecoute en une fraction de seconde.
      start_period: 10s
      retries: 5

    # Pas de depends_on : Mailpit ne depend de rien, et rien ne lui envoie encore
    # de courriel. C'est l'inverse qui viendra, avec l'adaptateur de BACK-22.
    networks: [app_network]
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Fichiers de configuration injectes dans les conteneurs
# -----------------------------------------------------------------------------
# Le ticket parle d'« un fichier servers.json ». Il est ici INLINE plutot que
# versionne dans docker/pgadmin/, pour deux raisons :
#   - un fichier .json ne peut porter aucun commentaire, alors que tout le reste
#     du depot en porte ;
#   - surtout, compose interpole `${...}` ici comme ailleurs, la ou un fichier
#     JSON aurait fige `juui`, `juui` et `5432` en dur -- une seconde source de
#     verite a cote du .env, qui divergerait au premier renommage.
configs:
  # Definition de serveur pre-remplie, importee au demarrage de pgAdmin.
  #
  # Le mot de passe ne figure PAS ici : `passfile` renvoie au pgpass ci-dessous.
  # Deux details qui ne s'inventent pas : depuis pgAdmin 6.9 `passfile` se range
  # dans ConnectionParameters et non a la racine du serveur (a la racine, la cle
  # est acceptee puis silencieusement ignoree) ; et le chemin `/.pgpass` est
  # relatif a l'espace de stockage de l'utilisateur, pas a la racine du systeme
  # de fichiers -- le point initial vient du nom que l'entrypoint donne a sa
  # copie.
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Juui - PostgreSQL local",
            "Group": "Servers",
            "Host": "postgres",
            "Port": ${POSTGRES_PORT},
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/.pgpass"
            }
          }
        }
      }

  # Format libpq : hote:port:base:utilisateur:motdepasse. `*` vaut pour toutes
  # les bases, ce qui couvre `juui` comme `app_test`. `postgres` est le nom du
  # service, resolu dans app_network.
  pgadmin_pgpass:
    content: |
      postgres:${POSTGRES_PORT}:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

# -----------------------------------------------------------------------------
# Reseau et volumes
# -----------------------------------------------------------------------------
# Aucune cle `name:` nulle part : compose prefixe d'office par
# COMPOSE_PROJECT_NAME, ce qui donne `juui_app_network`, `juui_postgres_data`...
# C'est exactement la raison d'etre de cette variable -- ne pas entrer en
# collision avec un autre projet organise de la meme facon sur le meme poste.

networks:
  # Reseau unique, partage par tous les services de la pile. C'est lui qui rend
  # `postgres` resolvable comme nom d'hote depuis les autres conteneurs.
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:
  minio_data:
