# Pile de developpement conteneurisee (INFRA-01 pour le socle ; ensuite un
# service par ticket, chacun nomme dans le commentaire qui l'introduit).
#
# Ce fichier assemble les services d'infrastructure du poste. INFRA-01 en pose
# les deux premiers -- PostgreSQL et pgAdmin -- et surtout le socle dont
# heriteront les suivants : le reseau `app_network`, la convention de
# healthcheck, et l'interpolation systematique depuis le .env.
#
# OU VIT LE .env
# Ce fichier est dans docker/, le .env est a la RACINE. Livre a lui-meme,
# `docker compose` chercherait son .env a cote de lui, ne trouverait rien, et
# toutes les `${...}` ci-dessous vaudraient la chaine vide -- sans la moindre
# erreur. D'ou le `--project-directory .` de toutes les commandes du README, et
# plus tard de `make up` (INFRA-06) :
#
#   docker compose --project-directory . -f docker/docker-compose.yml up -d
#
# CONSEQUENCE, contre-intuitive et verifiee : `--project-directory` ne deplace
# pas seulement la recherche du .env, il deplace AUSSI la resolution des chemins
# relatifs des montages. Ceux-ci partent donc de la RACINE, pas de docker/ --
# d'ou le `./docker/postgres/init` plus bas, qui a l'air d'une faute de frappe
# et n'en est pas une. Ce fichier n'est utilisable QUE lance ainsi ; toute autre
# invocation monterait un dossier inexistant, que Docker creerait vide, sans
# erreur et sans base de test.
#
# `docker compose config` imprime les chemins absolus finalement retenus : c'est
# la verification a faire apres toute modification de ce fichier.
#
# Pas de cle `version:` : obsolete depuis Compose V2, qui avertit si elle est la.
#
# Chaque variable employee ici est documentee dans .env.example, ticket par
# ticket. Ce fichier ne redit pas ce qu'elle vaut, seulement ce qu'il en fait.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL -- base applicative (INFRA-01, consommee par BACK-05 et BACK-12)
  # ---------------------------------------------------------------------------
  postgres:
    # Le ticket demande une 16 ; on lit une 18. Voir « Ecarts assumes avec le
    # ticket INFRA-01 » dans le README.
    image: postgres:18-alpine

    environment:
      # Noms IMPOSES par l'image officielle : les renommer casserait
      # l'initialisation du cluster.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Pas lu par l'image, mais par notre script d'initialisation : c'est ce qui
      # permet a .env.example de promettre que le nom de la base de test reste
      # modifiable sans toucher au script.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}

      # C'est cette ligne, et elle seule, qui rend POSTGRES_PORT effectif. Le
      # postmaster prend PGPORT comme port par defaut ; le serveur temporaire de
      # la phase d'initialisation le suit, et `pg_isready` aussi puisque c'est
      # aussi une variable libpq. Sans elle, POSTGRES_PORT ne serait qu'une
      # decoration a droite du mapping ci-dessous : le serveur ecouterait 5432
      # quoi qu'il arrive, et le publier sur un autre port echouerait.
      PGPORT: ${POSTGRES_PORT}

    ports:
      # <port publie sur le poste>:<port ecoute dans app_network>. Seul le
      # premier a besoin de changer quand un PostgreSQL local occupe deja 5432.
      - '${POSTGRES_HOST_PORT}:${POSTGRES_PORT}'

    volumes:
      # PIEGE MAJEUR, et la raison d'etre du critere d'acceptation « les donnees
      # survivent a un down puis up ». Depuis la 18, l'image a DEPLACE ses
      # donnees : PGDATA vaut /var/lib/postgresql/18/docker et le VOLUME declare
      # est /var/lib/postgresql. Le montage traditionnel sur
      # /var/lib/postgresql/data ne produit AUCUNE erreur -- il ne recoit
      # simplement plus rien, les donnees partent dans un volume anonyme, et
      # elles disparaissent au premier `down`. Monter le dossier parent, donc.
      - postgres_data:/var/lib/postgresql

      # Scripts joues UNE SEULE FOIS, a la creation du cluster. Chemin relatif
      # a la RACINE et non a docker/ -- voir la mise en garde en tete de fichier.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # `$$` echappe le `$` : sans cela compose interpolerait ces deux variables
      # depuis le .env de l'hote au lieu de les laisser au shell du conteneur.
      #
      # `-h 127.0.0.1` n'est pas decoratif. Pendant l'initialisation, l'entrypoint
      # demarre un serveur temporaire avec `listen_addresses=''` : joignable par
      # la socket Unix, mais par aucune connexion TCP. Un `pg_isready` sans hote
      # passerait par cette socket et declarerait le service sain alors qu'il
      # n'accepte encore personne -- et les `service_healthy` des services
      # dependants (INFRA-04) partiraient trop tot.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      # `start_period` couvre la premiere initialisation, la plus lente : les
      # echecs qui y surviennent ne comptent pas dans `retries`.
      start_period: 30s
      retries: 5

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin -- console d'administration de la base (INFRA-01)
  # ---------------------------------------------------------------------------
  pgadmin:
    # Tag de MAJEURE : les correctifs arrivent au prochain `docker pull`, jamais
    # un changement d'interface en pleine semaine.
    image: dpage/pgadmin4:9

    environment:
      # Noms imposes par l'image. L'adresse doit etre syntaxiquement valide,
      # sinon le conteneur refuse de demarrer.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

      # En mode serveur, pgAdmin reclame par defaut un « mot de passe maitre »
      # a la premiere connexion, avant meme d'afficher quoi que ce soit. Ce
      # serait exactement la saisie manuelle que le ticket demande d'eviter.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

      # Sans cela l'image demarre un Postfix pour envoyer des courriels de
      # reinitialisation de mot de passe. Sur un poste de developpement il
      # n'enverra jamais rien, et il rallonge chaque demarrage.
      PGADMIN_DISABLE_POSTFIX: 'True'

      # Par defaut, la definition de serveur ci-dessous n'est lue qu'a la
      # CREATION de la base de configuration de pgAdmin -- donc une seule fois
      # dans la vie du volume `pgadmin_data`. Avec ce drapeau elle est rejouee a
      # chaque demarrage : changer POSTGRES_USER dans le .env suffit alors a
      # mettre la console a jour, sans `down -v`.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'

      # Fichier de mots de passe au format libpq, fabrique plus bas. C'est lui
      # qui evite d'avoir a retaper POSTGRES_PASSWORD a chaque ouverture de la
      # connexion.
      PGPASS_FILE: /pgpass

    configs:
      # `/pgadmin4/servers.json` est le chemin que l'image lit d'office.
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      # PGPASS_FILE fait recopier ce fichier par l'entrypoint dans l'espace de
      # stockage de l'utilisateur, sous le nom `.pgpass` et en 0600 -- ce que
      # libpq exige. `uid: '5050'` est necessaire : le montage est en lecture
      # seule et 0400, donc illisible par le compte pgadmin s'il ne lui
      # appartient pas. Le gid n'est pas force, le compte pgadmin de l'image
      # etant du groupe root.
      - source: pgadmin_pgpass
        target: /pgpass
        uid: '5050'
        mode: 0400

    ports:
      # Le conteneur ecoute sur 80 ; PGADMIN_HOST_PORT vaut 5050 par defaut.
      - '${PGADMIN_HOST_PORT}:80'

    volumes:
      # Base de configuration de pgAdmin, sessions et fichiers utilisateur.
      # L'image tourne en uid 5050 ; un volume nomme encore vide herite des
      # droits du dossier de l'image, il n'y a donc rien a ajuster a la main.
      - pgadmin_data:/var/lib/pgadmin

    healthcheck:
      # /misc/ping repond `PING` en 200 sans authentification : c'est la sonde
      # que pgAdmin expose pour cet usage. `wget` est present dans l'image.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/misc/ping']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    depends_on:
      # pgAdmin demarrerait tres bien sans base. La dependance est ici pour poser
      # le motif que reprendront INFRA-04 et BACK-15, pour qui attendre un
      # PostgreSQL REELLEMENT pret sera vital.
      postgres:
        condition: service_healthy

    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis -- cache applicatif ET broker de taches (INFRA-02, consomme par
  # BACK-14 et BACK-15)
  # ---------------------------------------------------------------------------
  # Une seule instance, deux usages separes par le NUMERO DE BASE : la 0 pour le
  # cache, la 1 pour la file de taches. Rien ici ne l'impose -- la convention
  # vit dans REDIS_CACHE_DB et REDIS_BROKER_DB, et dans les clients qui les
  # lisent. Ce service se contente de ne jamais la contredire, et la console
  # plus bas la rend visible.
  redis:
    # Le ticket demande une 7 ; on lit une 8. Voir « Ecarts assumes avec le
    # ticket INFRA-02 » dans le README.
    image: redis:8-alpine

    # Deux arguments, deux natures. Le fichier porte les reglages statiques et
    # les raisons qui les accompagnent ; le port vient du .env, et il ne peut
    # venir que d'ici -- un redis.conf n'interpole aucune variable
    # d'environnement. En cas de desaccord, la ligne de commande l'emporte.
    #
    # Chemin relatif a la RACINE et non a docker/ : meme mise en garde qu'en
    # tete de fichier.
    command: redis-server /usr/local/etc/redis/redis.conf --port ${REDIS_PORT}

    ports:
      # Rattache a la BOUCLE LOCALE, contrairement a `postgres` ci-dessus.
      # L'asymetrie est voulue : postgres exige un mot de passe, cette instance
      # Redis n'en a pas. Sans le `127.0.0.1:`, Docker publierait sur toutes les
      # interfaces du poste, et n'importe qui sur le meme reseau -- un wifi
      # partage suffit -- pourrait y lire et y ecrire sans rien presenter. Les
      # conteneurs, eux, passent par app_network et ne sont pas concernes.
      - '127.0.0.1:${REDIS_HOST_PORT}:${REDIS_PORT}'

    volumes:
      # /data est a la fois le VOLUME declare par l'image et son repertoire de
      # travail ; c'est la que redis.conf pointe `dir`, donc la que Redis cree
      # `appendonlydir/`. Rien a deplacer, contrairement au piege de postgres 18.
      - redis_data:/data

      # Lecture seule : voir « COMMENT IL EST LU » en tete du redis.conf.
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      # `| grep -q PONG` n'est pas une coquetterie. Au demarrage, le temps de
      # rejouer l'AOF, le serveur repond `LOADING Redis is loading the dataset
      # in memory` : il ecoute deja, mais ne sert encore rien. C'est le grep, et
      # non le code de retour de redis-cli, qui distingue les deux -- et qui
      # rendra fiables les `service_healthy` de BACK-15 et INFRA-04.
      test: ['CMD-SHELL', 'redis-cli -p ${REDIS_PORT} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      # Bien plus court que celui de postgres : Redis n'a aucune initialisation
      # de cluster a mener, il relit un journal deja ecrit.
      start_period: 10s
      retries: 5

    # Pas de depends_on : Redis ne depend de rien. C'est l'inverse qui viendra,
    # le worker de BACK-15 et l'API d'INFRA-04 attendant le healthcheck ci-dessus.
    networks: [app_network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RedisInsight -- console d'inspection de Redis (INFRA-02, profil `tools`)
  # ---------------------------------------------------------------------------
  redisinsight:
    # Pas de tag de majeure nue chez cette image -- `3` n'existe pas : on
    # epingle la ligne mineure courante, plus proche equivalent du
    # `dpage/pgadmin4:9` d'INFRA-01.
    image: redis/redisinsight:3.8

    # Le ticket demande que cette console ne demarre PAS d'office. Un service
    # rattache a un profil est ignore par `docker compose up` tant que
    # `--profile tools` n'est pas passe ; son port n'est donc occupe que sur
    # demande.
    profiles: [tools]

    environment:
      # Connexions pre-remplies : l'equivalent RedisInsight du servers.json de
      # pgAdmin. Le suffixe numerique distingue les entrees, et il commence a 1.
      #
      # Elles sont DEUX a dessein. C'est le seul endroit du depot ou la
      # convention « base 0 = cache, base 1 = broker » cesse d'etre un
      # commentaire pour devenir quelque chose qu'on voit en ouvrant la console.
      #
      # A SAVOIR : ces variables font autorite a chaque demarrage. Une connexion
      # ajoutee a la main dans l'interface disparaitra au redemarrage suivant.
      RI_REDIS_HOST1: redis
      RI_REDIS_PORT1: ${REDIS_PORT}
      RI_REDIS_DB1: ${REDIS_CACHE_DB}
      RI_REDIS_ALIAS1: 'Juui - cache applicatif (base ${REDIS_CACHE_DB})'

      RI_REDIS_HOST2: redis
      RI_REDIS_PORT2: ${REDIS_PORT}
      RI_REDIS_DB2: ${REDIS_BROKER_DB}
      RI_REDIS_ALIAS2: 'Juui - broker TaskIQ (base ${REDIS_BROKER_DB})'

      # Sans cela, la console s'ouvre sur des conditions d'utilisation a
      # accepter -- exactement la saisie manuelle qu'INFRA-01 s'etait attache a
      # eviter cote pgAdmin. C'est deja le defaut de l'image ; l'ecrire met le
      # comportement a l'abri d'un changement de defaut.
      RI_ACCEPT_TERMS_AND_CONDITIONS: 'true'

    ports:
      # 5540 en dur a droite : l'image ecrit elle-meme que le port est fige, et
      # RI_APP_PORT ne ferait que deplacer la question. Boucle locale a gauche,
      # comme redis, et pour une raison de plus : cette console n'a AUCUNE
      # authentification et donne acces a toutes les donnees de l'instance.
      - '127.0.0.1:${REDISINSIGHT_HOST_PORT}:5540'

    volumes:
      # Base locale de la console : connexions, historique du Workbench, index.
      # L'image tourne en uid 1000 et cree /data a ce compte ; un volume nomme
      # encore vide en herite les droits, il n'y a rien a ajuster a la main.
      - redisinsight_data:/data

    healthcheck:
      # Sonde que la console expose pour cet usage, sur le meme modele que celle
      # de pgAdmin -- a UN detail pres, verifie a la main : `127.0.0.1` et non
      # `localhost`. Le /etc/hosts du conteneur fait pointer `localhost` sur
      # 127.0.0.1 ET sur ::1, wget tente l'IPv6 d'abord, et RedisInsight
      # n'ecoute qu'en IPv4 (RI_APP_HOST vaut 0.0.0.0). Avec `localhost` la
      # sonde echoue donc en boucle sur un `Connection refused`, alors meme que
      # la console repond parfaitement depuis le navigateur.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:5540/api/health/']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    depends_on:
      # Ici la dependance n'est pas decorative, comme elle l'etait pour pgAdmin :
      # sans Redis joignable, la console ouvre sur deux connexions en erreur.
      redis:
        condition: service_healthy

    networks: [app_network]
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Fichiers de configuration injectes dans les conteneurs
# -----------------------------------------------------------------------------
# Le ticket parle d'« un fichier servers.json ». Il est ici INLINE plutot que
# versionne dans docker/pgadmin/, pour deux raisons :
#   - un fichier .json ne peut porter aucun commentaire, alors que tout le reste
#     du depot en porte ;
#   - surtout, compose interpole `${...}` ici comme ailleurs, la ou un fichier
#     JSON aurait fige `juui`, `juui` et `5432` en dur -- une seconde source de
#     verite a cote du .env, qui divergerait au premier renommage.
configs:
  # Definition de serveur pre-remplie, importee au demarrage de pgAdmin.
  #
  # Le mot de passe ne figure PAS ici : `passfile` renvoie au pgpass ci-dessous.
  # Deux details qui ne s'inventent pas : depuis pgAdmin 6.9 `passfile` se range
  # dans ConnectionParameters et non a la racine du serveur (a la racine, la cle
  # est acceptee puis silencieusement ignoree) ; et le chemin `/.pgpass` est
  # relatif a l'espace de stockage de l'utilisateur, pas a la racine du systeme
  # de fichiers -- le point initial vient du nom que l'entrypoint donne a sa
  # copie.
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Juui - PostgreSQL local",
            "Group": "Servers",
            "Host": "postgres",
            "Port": ${POSTGRES_PORT},
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/.pgpass"
            }
          }
        }
      }

  # Format libpq : hote:port:base:utilisateur:motdepasse. `*` vaut pour toutes
  # les bases, ce qui couvre `juui` comme `app_test`. `postgres` est le nom du
  # service, resolu dans app_network.
  pgadmin_pgpass:
    content: |
      postgres:${POSTGRES_PORT}:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

# -----------------------------------------------------------------------------
# Reseau et volumes
# -----------------------------------------------------------------------------
# Aucune cle `name:` nulle part : compose prefixe d'office par
# COMPOSE_PROJECT_NAME, ce qui donne `juui_app_network`, `juui_postgres_data`...
# C'est exactement la raison d'etre de cette variable -- ne pas entrer en
# collision avec un autre projet organise de la meme facon sur le meme poste.

networks:
  # Reseau unique, partage par tous les services de la pile. C'est lui qui rend
  # `postgres` resolvable comme nom d'hote depuis les autres conteneurs.
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:
