# Configuration d'Alembic (BACK-07).
#
# AUCUNE URL DE BASE ICI, ET C'EST LE POINT : la connexion se lit dans
# `Settings` (app.core), la meme source que l'application -- env.py est le seul
# lecteur. Ce fichier ne porte que la mecanique de l'outil : emplacement des
# scripts, nommage des fichiers, hooks de generation, journalisation.
#
# C'est aussi la PRESENCE de ce fichier qui active l'etape « migrations » de
# docker/api/entrypoint.sh, ecrite d'avance par INFRA-04.

[alembic]
# Ancre sur CE fichier (%(here)s) et non sur le repertoire courant : la
# commande marche depuis backend/api comme depuis la racine du monorepo via
# `alembic -c backend/api/alembic.ini`.
script_location = %(here)s/alembic

# Nom des fichiers : l'horodatage (jour) prefixe le hash, pour que
# `ls versions/` raconte l'histoire dans l'ordre. Les `%%` echappent le `%`
# aupres de configparser : ils s'ecrivent tels quels.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Horodatages (nom de fichier et Create Date) en UTC : deux postes dans deux
# fuseaux nomment et datent pareil. Ne sert qu'a `alembic revision`, jamais
# dans les conteneurs.
timezone = UTC

# Separateur des listes de chemins delegue a os.pathsep -- le defaut des
# projets neufs, declare pour ne pas dependre du comportement de repli.
path_separator = os

# La migration fraichement generee passe par Ruff -- correction puis
# formatage : elle nait conforme aux regles du projet au lieu de les decouvrir
# en CI. Ces hooks ne tournent qu'a `alembic revision`, jamais dans les
# conteneurs, ou Ruff (dependance de developpement) n'est pas installe.
[post_write_hooks]
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Journalisation : la racine se tait en-deca des avertissements, Alembic
# annonce chaque revision appliquee -- la trace qu'on lit dans les logs du
# conteneur (entrypoint d'INFRA-04).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
