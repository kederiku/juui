# Service d'API Juui (BACK-01).
#
# Projet Python outille par uv, volontairement hors des workspaces pnpm : le
# pnpm-workspace.yaml de la racine ne le liste pas, et l'eslint.config.mjs
# ignore backend/**. Les deux outillages coexistent sans se marcher dessus.

[project]
name = "juui-api"
version = "0.1.0"
description = "API du SaaS veterinaire Juui (FastAPI, architecture hexagonale et DDD)"
readme = "README.md"
# Expression SPDX (PEP 639). Le fichier LICENSE vit a la racine du monorepo,
# hors du repertoire de build : on ne declare donc que l'identifiant.
license = "MIT"

# Borne HAUTE volontaire, en plus de la borne basse. Sans elle, uv choisirait
# sur un poste neuf la version la plus recente disponible -- y compris une
# alpha de 3.15 -- et le .python-version ne vaudrait plus que pour ce poste-ci.
# La montee de version est ainsi un geste explicite, visible en diff.
requires-python = ">=3.14,<3.15"

dependencies = [
    # --- Coeur HTTP ---
    "fastapi~=0.141.1",
    # L'extra `standard` apporte uvloop, httptools et watchfiles : la boucle
    # d'evenements rapide, le parseur HTTP en C et le rechargement a chaud
    # (--reload). Tous publient des roues pour Python 3.14, rien ne compile.
    "uvicorn[standard]~=0.52.4",

    # --- Validation et configuration ---
    "pydantic~=2.13",
    # Lu par BACK-03 pour l'objet Settings ; declare des maintenant pour que le
    # lock soit resolu une seule fois sur l'ensemble du jeu de dependances.
    "pydantic-settings~=2.15",

    # --- Persistance ---
    # SQLAlchemy reste en 2.0.x : la 2.1 modifie l'API declarative, et toute la
    # couche de persistance a venir (BACK-05 a BACK-07) est ecrite pour 2.0.
    # L'extra `asyncio` tire greenlet, sans lequel le mode asynchrone ne
    # fonctionne pas -- ce n'est pas une dependance optionnelle deguisee.
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg~=0.31.0",
    "alembic~=1.19",

    # --- Securite ---
    "pyjwt~=2.13",

    # --- Infrastructure ---
    "redis~=8.1",
    "taskiq~=0.12.5",
    # Le broker retenu (BACK-15) est RedisStreamBroker : le seul broker Redis
    # de TaskIQ qui ACQUITTE les messages -- un worker tue en pleine execution
    # ne perd pas la tache, le stream la represente. Sa borne `redis>=8.0,<9`
    # est satisfaite par le `redis~=8.1` ci-dessus.
    "taskiq-redis~=1.2.3",
    "boto3~=1.43",
]

[dependency-groups]
# Groupe `dev` : jamais installe en production. Le build Docker d'INFRA-04
# passera `uv sync --frozen --no-dev`, ce qui l'ecarte entierement de l'image.
dev = [
    # Qualite et typage -- CONFIGURES en BACK-02, seulement declares ici.
    #
    # Ruff est epingle a l'exact et non en `~=`. Un linter qui change d'avis
    # tout seul entre deux `uv sync` ferait echouer la CI de QA-01 sans qu'une
    # ligne de code ait bouge : sa montee de version doit etre un commit dedie.
    "ruff==0.16.4",
    "mypy~=2.3",

    # Garde-fous d'architecture (BACK-04b) -- les contrats sont plus bas, en
    # [tool.importlinter]. Epingle a l'exact pour EXACTEMENT la meme raison que
    # Ruff : il fait echouer la CI. Une regle durcie ou un graphe d'imports
    # calcule autrement par grimp ne doit pas arriver par surprise entre deux
    # `uv sync`.
    "import-linter==2.13",

    # Tests -- la strategie a trois niveaux est l'objet de BACK-12.
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    # Client HTTP de test (ASGITransport). Egalement utile comme client sortant
    # si un adaptateur en a besoin, auquel cas il passera en dependance
    # applicative.
    "httpx~=0.28.1",

    # Stubs de typage. Le ticket demandait « types-* » au pluriel ; en pratique
    # boto3 est le seul de la liste a ne pas embarquer son propre `py.typed`.
    # fastapi, pydantic, sqlalchemy, pyjwt, redis et httpx sont tous types a la
    # source, et leurs paquets `types-*` d'antan sont depuis retires de PyPI.
    # L'extra [s3] limite les stubs au service reellement utilise (BACK-13) :
    # boto3-stubs complet, c'est plus de 400 sous-paquets.
    "boto3-stubs[s3]~=1.43",
]

# Le backend de build est celui d'uv, integre au binaire : un paquet de moins a
# resoudre que hatchling, et rien a installer separement.
#
# BORNE HAUTE A 0.13 ET NON A 0.12. Celle d'origine etait la sortie litterale
# de `uv init` sous uv 0.11 ; elle est devenue fausse le jour ou uv 0.12 est
# sorti, et chaque `uv sync` de la CI le disait en clair. Verifie avant de
# l'elargir, en amont : les notes de version de 0.12.0 annoncent « no breaking
# changes to the configuration of the uv build backend » et recommandent
# d'ouvrir jusqu'a 0.13. Verifie AUSSI sur ce projet, ou le `module-name`
# ci-dessous et la disposition src/ sont ce qui pourrait souffrir -- les deux
# roues construites sous 0.11.7 et sous 0.12.5 portent 37 fichiers dont 35 sont
# identiques octet pour octet, les deux autres etant la ligne `Generator:` du
# fichier WHEEL, qui nomme le constructeur, et son empreinte dans RECORD. Le
# paquet `app/` et le METADATA ne bougent pas d'un octet.
#
# CETTE BORNE NE CONTRAINT RIEN, et il faut le savoir pour ne pas s'y fier :
# uv emploie son backend integre des que la version declaree tombe dans sa
# plage connue compatible, et ne va chercher le paquet `uv_build` sur PyPI que
# HORS de cette plage. La CI construisait donc deja avec uv_build 0.12.5 quand
# la borne disait <0.12.0 -- l'avertissement signalait une declaration perimee,
# pas un changement de backend. Ce que la borne declare, ce sont les versions
# sous lesquelles cette roue est VERIFIEE : d'ou le plancher tenu a 0.11.7, la
# version qui a construit le projet et celle qu'embarquait l'image Docker, et
# non le 0.11.32 de l'exemple amont, qui rendrait la declaration fausse pour
# les roues deja produites.
#
# 0.13 est le meme mur que celui du `required-version` ci-dessous, a dessein :
# uv monte son mineur pour ses ruptures. Les deux bornes se rediscutent donc
# ensemble, une fois, plutot que de ceder l'une apres l'autre.
[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

# Version d'uv EXIGEE, et non suggeree. Trois endroits la portent : le
# `version:` de setup-uv dans .github/workflows/ci-backend.yml, l'ARG
# UV_VERSION du Dockerfile d'INFRA-04, et le uv du poste. Rien ne les obligeait
# a s'accorder -- c'est ainsi que la CI a derive en 0.12.5 pendant que le poste
# restait en 0.11.7, et que l'ecart ne s'est vu que dans un avertissement de
# log, c'est-a-dire nulle part. Cette ligne le fait ECHOUER, des le premier
# `uv` lance, en nommant la version attendue.
#
# Une plage et non un `==`, pour qu'une montee de patch cote Homebrew n'arrete
# pas le poste : ce qui doit se voir, c'est le saut de mineur. Le mur est donc
# a 0.13, la ou uv s'autorise ses ruptures -- meme borne que le `uv_build`
# ci-dessus, et c'est le but.
[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.uv.build-backend]
# Le ticket impose le chemin backend/api/src/app/main.py et la cible
# `uvicorn app.main:app` : le module s'appelle donc `app`, alors que le projet
# se nomme juui-api. Sans cette ligne, le backend de build chercherait
# src/juui_api/ et echouerait.
module-name = "app"

# ---------------------------------------------------------------------------
# Qualite et typage (BACK-02)
# ---------------------------------------------------------------------------
# Ruff assure le lint ET le formatage : `ruff format` remplace Black, il n'y a
# donc aucune section [tool.black] ni aucune autre dependance de formatage.

[tool.ruff]
line-length = 100

# Le ticket BACK-02 annonce `py312`. On lit py314, et c'est delibere : le projet
# est verrouille sur requires-python = ">=3.14,<3.15". Cibler py312 ferait
# refuser a Ruff la syntaxe recente et lui ferait reecrire du code deja moderne.
target-version = "py314"

# Racine des sources, pour que le tri des imports (I) reconnaisse `app` comme
# premier-parti meme lorsque Ruff est lance depuis la racine du monorepo --
# ce que fera lint-staged en SETUP-04, qui passe des chemins absolus.
src = ["src"]

[tool.ruff.lint]
# E/F      pycodestyle + Pyflakes : le socle.
# I        tri des imports (remplace isort).
# N        conventions de nommage PEP 8.
# UP       modernisation de la syntaxe vers la cible py314.
# B        pieges classiques (flake8-bugbear).
# A        masquage des builtins.
# C4       comprehensions inutilement verbeuses.
# SIM      simplifications logiques.
# RUF      regles propres a Ruff (dont RUF100, qui traque les `noqa` inutiles
#          et fait pendant au warn_unused_ignores de Mypy).
# ANN      annotations de type obligatoires -- la premiere barriere, Mypy etant
#          la seconde.
# S        securite (bandit).
# D        docstrings (pydocstyle).
#
# S et D ne figuraient pas dans la liste du ticket, alors que celui-ci demande
# d'autoriser `assert` et de dispenser de docstrings dans tests/. Sans eux cet
# assouplissement n'aurait relache rien du tout : ce sont precisement S101 et
# D1xx qui le rendent effectif.
#
# ANN101/ANN102 (annotation de self/cls) ne sont PAS ignorees, contrairement a
# ce que demande le ticket : Ruff les a RETIREES. Les nommer dans `ignore`
# n'aurait aucun effet, sinon un avertissement a chaque execution et dans chaque
# log de CI. L'intention du ticket est de toute facon satisfaite d'office.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "D"]

[tool.ruff.lint.pydocstyle]
# Convention Google : desactive les regles de mise en forme incompatibles avec
# les docstrings multi-lignes deja ecrites en BACK-01.
convention = "google"

[tool.ruff.lint.pep8-naming]
# Un @field_validator Pydantic recoit `cls` sans forcement porter @classmethod.
# Sans cette ligne, N805 reclame de le renommer en `self` -- un correctif qui
# CASSERAIT le validateur. On apprend donc a Ruff que ces decorateurs
# produisent des methodes de classe.
classmethod-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.ruff.lint.per-file-ignores]
# La regle a ete posee avant tests/ pour que la suite de tests naisse conforme ;
# BACK-06b a ouvert le dossier avec les tests d'isolation, BACK-12 apportera le
# harnais complet.
#
# S101 : `assert` est la maniere normale d'ecrire un test, pas une faille.
# D1   : un test se nomme, il ne se documente pas.
#
# ANN reste ACTIF ici : le ticket ne demandait d'assouplir que ces deux points,
# et `-> None` sur une fonction de test coute huit caracteres. A rediscuter en
# BACK-12 si la contrainte se revele penible.
"tests/**/*.py" = ["S101", "D1"]

# Le resume d'une migration est le message passe a `alembic revision -m` : un
# slug, pas une phrase -- meme esprit que la dispense des tests ci-dessus.
# Tout le reste (annotations, imports, format) est du, et tenu par le gabarit
# alembic/script.py.mako et les post_write_hooks d'alembic.ini (BACK-07).
"alembic/versions/*.py" = ["D400", "D415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"

# `strict` active a lui seul les trois drapeaux nommes par le ticket --
# disallow_untyped_defs, warn_return_any et warn_unused_ignores -- ainsi que
# disallow_any_generics, disallow_untyped_calls, disallow_incomplete_defs,
# check_untyped_defs, disallow_untyped_decorators, warn_redundant_casts,
# no_implicit_reexport, strict_equality et extra_checks. Les redeclarer serait
# du bruit : la liste ci-dessus tient lieu de documentation.
strict = true

# Le plugin Pydantic apprend a Mypy la signature reelle des __init__ generes.
plugins = ["pydantic.mypy"]

# Disposition src/ : permet de verifier un fichier isole (`mypy src/app/x.py`,
# ce que font les editeurs) sans perdre la resolution des imports `app.*`.
mypy_path = "src"

# Rend `uv run mypy` nu equivalent a la commande de `make typecheck`. alembic/
# entre au perimetre avec BACK-07 : env.py est annote de bout en bout, et les
# migrations sortent d'un gabarit annote -- les laisser dehors aurait fait des
# premiers .py hors de src/ les seuls non verifies. tests/ reste volontairement
# hors perimetre : c'est BACK-12 qui decidera de l'y faire entrer.
files = ["src", "alembic"]

# Une seule derogation, et elle est declaree PAR MODULE -- jamais globalement,
# ce qui aveuglerait Mypy sur tout le projet. BACK-02 pariait qu'aucune ne
# serait necessaire ; BACK-05 a trouve la premiere.
#
# asyncpg n'expose pas de py.typed et n'a pas de paquet de stubs maintenu. Il
# n'est importe qu'a un seul endroit -- `shared/infrastructure/db/engine.py`,
# pour nommer les exceptions du pilote que SQLAlchemy n'enveloppe PAS quand la
# connexion echoue. Le reste du code ne le voit jamais : c'est SQLAlchemy qui
# lui parle.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
# Un champ non annote, un kwargs inconnu ou mal type dans un Model(...) devient
# une erreur de typage plutot qu'une erreur de validation a l'execution.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# Configuration MINIMALE de pytest, tiree en avant par BACK-06b pour ses tests
# d'isolation -- ecart consigne au registre. Le harnais complet appartient a
# BACK-12 : les marqueurs unit/integration/slow, --strict-markers, la
# couverture et les fixtures generales s'ajouteront ici.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Mode auto : chaque test async tourne sans decorateur, decision anticipee sur
# BACK-12 -- necessaire pour ecrire le premier test asynchrone.
asyncio_mode = "auto"
# Fige le defaut actuel de pytest-asyncio et fait taire son avertissement.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "tenant_isolation: tests d'isolation multi-tenant (BACK-06b)",
]

# ---------------------------------------------------------------------------
# Garde-fous d'architecture (BACK-04b)
# ---------------------------------------------------------------------------
# BACK-04 a pose les regles ; les docstrings et la page « Architecture du
# service » du site de documentation les enoncent, et
# Import Linter les rend MECANIQUES : `lint-imports` lit le graphe d'imports
# reel du paquet `app` et refuse ce qui ne respecte pas les contrats
# ci-dessous. Une violation echoue donc en CI, elle ne se decouvre plus six
# mois plus tard en revue.
#
# Se lance par `make imports`, et par `make lint` qui l'enchaine apres Ruff.
#
# LES EXCEPTIONS. Aucune n'est necessaire aujourd'hui : les cinq contrats
# passent sur le code existant. Le jour ou l'une devient inevitable, elle
# s'ecrit dans le `ignore_imports` DU CONTRAT CONCERNE -- jamais en desactivant
# le contrat -- et porte son motif et sa date de revue :
#
#     ignore_imports = [
#         # MOTIF : <pourquoi cette entorse est tolerable>
#         # REVUE : AAAA-MM-JJ  <date a laquelle elle doit etre reexaminee>
#         "app.modules.x.domain -> paquet.y",
#     ]
#
# Rien n'oblige a tenir la date, mais rien ne laisse non plus l'exception
# dormir : `unmatched_ignore_imports_alerting` vaut "error" par defaut, si bien
# qu'une exception devenue sans objet fait echouer le lint au lieu de survivre
# a l'import qu'elle couvrait.

[tool.importlinter]
# Le paquet a analyser. Il doit etre IMPORTABLE : c'est le cas, `uv sync`
# installe le projet lui-meme, et `module-name = "app"` plus haut lui donne ce
# nom-la.
root_package = "app"

# Fait entrer les paquets EXTERNES dans le graphe. Sans cette ligne, `fastapi`
# ou `sqlalchemy` n'y existeraient pas et le contrat 1 ne pourrait pas les
# nommer. Leur code n'est pas analyse pour autant : seuls les imports QUE FAIT
# `app` vers eux sont observes.
include_external_packages = true

# `exclude_type_checking_imports` reste a son defaut (false), A DESSEIN : un
# import de SQLAlchemy sous `if TYPE_CHECKING:` dans une entite reste un
# couplage du domaine a une technologie. Qu'il ne coute rien a l'execution ne
# le rend pas acceptable -- c'est bien la signature de l'entite qui parlerait
# ORM.

# --- Contrat 1 : la purete du domaine --------------------------------------
# Le coeur metier ne connait que la bibliotheque standard et lui-meme. C'est ce
# qui le rend testable sans Docker et reutilisable depuis une tache de fond.
#
# `app.shared.domain` figure dans les sources en plus des modules : le ticket
# ne nomme que `app.modules.*.domain`, mais la racine des erreurs metier est un
# domaine comme un autre, et la sonde `grep` de BACK-04 la couvrait deja.
#
# La liste interdite depasse les cinq paquets nommes par le ticket, et il le
# faut : `pydantic_settings` est un paquet DISTINCT de `pydantic`, et `jwt` est
# le nom d'import reel de `pyjwt`. S'en tenir a cinq laisserait passer les
# sept autres. Regle a tenir : toute dependance applicative ajoutee au projet
# s'ajoute ici, dans la meme pull request.
#
# `app.core` n'y figure PAS, bien qu'un domaine pur ne devrait rien lire de sa
# configuration. L'arbitrage appartient a BACK-04, qui l'a rendu par ecrit dans
# la docstring de src/app/core/__init__.py -- « le domaine ne doit rien y
# importer d'autre que des reglages ». Le contrat 5 garde le sens de la
# dependance, il ne la supprime pas.
#
# `allow_indirect_imports` reste a son defaut (false) : une chaine
# `domain -> X -> sqlalchemy` est une violation au meme titre qu'un import
# direct. C'est precisement ce qu'aucun `grep` ne sait voir.
[[tool.importlinter.contracts]]
id = "domain-purity"
name = "1. Purete du domaine"
type = "forbidden"
source_modules = [
    "app.modules.*.domain",
    "app.shared.domain",
]
forbidden_modules = [
    # Les cinq du ticket.
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "redis",
    "boto3",
    # Le reste des dependances applicatives declarees plus haut.
    #
    # `botocore` n'est pas une dependance DECLAREE mais une transitive de boto3,
    # et il est malgre tout nomme ici : BACK-13 l'importe DIRECTEMENT dans son
    # adaptateur -- `Config` et les exceptions du client viennent de la, pas de
    # boto3. Interdire `boto3` sans lui laisserait donc au domaine un chemin
    # ouvert vers exactement la meme technologie. La regle a tenir s'etend ainsi :
    # tout paquet qu'un adaptateur importe par son nom s'ajoute ici.
    "botocore",
    "pydantic_settings",
    "asyncpg",
    "alembic",
    "jwt",
    "taskiq",
    # Application de la regle ci-dessus, dans la meme pull request que la
    # dependance : le broker (BACK-15) importe `taskiq_redis` par son nom.
    "taskiq_redis",
    "uvicorn",
    # Client HTTP du groupe dev, qui deviendrait applicatif si un adaptateur
    # sortant en avait besoin. Interdit d'avance : appeler le reseau depuis le
    # domaine est exactement ce que les ports evitent.
    "httpx",
]

# --- Contrat 2 : le sens des couches, dans chaque module --------------------
# L'infrastructure depend de l'application, qui depend du domaine. Jamais
# l'inverse : une entite qui importerait un modele SQLAlchemy retournerait la
# fleche et rendrait le domaine intestable.
#
# `containers` porte un JOKER plutot qu'une liste nommee. Le contrat couvre
# ainsi `organization` (BACK-16), `medical_records` (BACK-19) et les suivants
# LE JOUR OU ILS NAISSENT : c'est la difference entre un garde-fou et une liste
# a tenir a jour, qu'on oublie une fois.
#
# Les couches sont entre parentheses, donc OPTIONNELLES. Il le faut :
# src/app/modules/organization/ ne porte encore qu'un __init__.py, et un module
# vide ferait echouer un contrat qui exigerait ses trois couches.
#
# `exhaustive` rattrape tout ce que les parentheses relachent, et c'est ce qui
# rend le contrat utile malgre elles : un `services/` ou un `utils.py` ajoute
# dans un module fait echouer le contrat tant qu'il n'est pas declare comme une
# couche. Un decoupage clandestin n'a donc pas d'endroit ou se cacher.
#
# `unit_of_work` est la seule exemption. Ce n'est pas une couche : BACK-04 le
# range volontairement A LA RACINE du module, parce qu'il compose les trois.
[[tool.importlinter.contracts]]
id = "module-layers"
name = "2. Sens des couches dans chaque module"
type = "layers"
layers = [
    "(infrastructure)",
    "(application)",
    "(domain)",
]
containers = ["app.modules.*"]
exhaustive = true
exhaustive_ignores = ["unit_of_work"]

# --- Contrat 3 : l'independance des modules ---------------------------------
# LE contrat qui protege les frontieres de contexte, et celui qui manquait a la
# version initiale de BACK-04. Un module n'importe jamais l'interieur d'un
# autre : ni son entite, ni son depot, ni son modele de persistance. Les
# echanges passent par les cas d'usage publics du module cible.
#
# Un contrat d'independance regarde les chaines d'imports DANS LES DEUX SENS et
# meme INDIRECTEMENT : `organization -> app.shared.x -> identity` echoue tout
# autant qu'un import direct. C'est ce qui le rend superieur au `grep` qu'il
# remplace, lequel ne voyait qu'une ligne a la fois.
#
# Meme joker que le contrat 2, et pour la meme raison.
[[tool.importlinter.contracts]]
id = "module-independence"
name = "3. Independance des modules"
type = "independence"
modules = ["app.modules.*"]

# --- Contrat 4 : le sens des couches du noyau partage -----------------------
# Hors portee litterale du ticket, et pourtant du meme bois : `app.shared` a un
# domaine (racine des erreurs, ports techniques) et une infrastructure (socles
# de persistance et d'API). Sans ce contrat, la seule couche du service dont
# TOUS les modules dependent serait la seule que rien ne garde.
#
# Deux couches et non trois : le noyau partage n'orchestre aucun cas d'usage,
# il n'a donc pas de couche `application`. Elles ne sont pas optionnelles --
# les deux existent, et leur disparition doit se voir.
[[tool.importlinter.contracts]]
id = "shared-layers"
name = "4. Sens des couches du noyau partage"
type = "layers"
layers = [
    "infrastructure",
    "domain",
]
containers = ["app.shared"]
exhaustive = true

# --- Contrat 5 : le sens des dependances entre les espaces du service -------
# C'est ce contrat qui rend mecanique la phrase du ticket : « app.shared est
# declare importable par tous les modules ; l'inverse est interdit ».
#
# La hierarchie reprend celle qu'annonce la docstring de src/app/__init__.py :
#   main    -- seul fichier autorise a connaitre plusieurs modules a la fois ;
#   modules -- les contextes metier ;
#   shared  -- le noyau qu'ils partagent, qui ne les connait pas ;
#   core    -- les reglages du PROCESSUS, qui ne connaissent personne.
#
# `exhaustive` fait de cette liste la definition meme du service : un nouveau
# dossier a la racine d'`app` echoue tant qu'on n'a pas dit ou il se range.
# BACK-11 (journalisation) sera le premier a s'y confronter, et c'est voulu --
# la question « core ou shared ? » doit se poser au moment ou le dossier nait.
[[tool.importlinter.contracts]]
id = "service-spaces"
name = "5. Sens des dependances entre les espaces du service"
type = "layers"
layers = [
    "main",
    "modules",
    "shared",
    "core",
]
containers = ["app"]
exhaustive = true
